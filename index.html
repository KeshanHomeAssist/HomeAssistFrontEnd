<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b2244" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--app-head-->

    <!-- Google Analytics 4. send_page_view is off on purpose: this is a
         prerendered site that hydrates into a router, so page views are sent
         per route from src/analytics.js. Leaving it on would double-count every
         landing page. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FL8J3DD2DX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FL8J3DD2DX', { send_page_view: false });
    </script>

    <!-- Homepage A/B test while Home Assist Rewards is running.
         Updated 19 October 2026 on Keshan's instruction.

         WHAT IS TESTED
           While the competition is on, every visitor sees a rewards hero, and
           the test is between the two pictures:
             b = all three prizes in one picture
             c = the solar geyser picture (tank lettered WIN WIN WIN)
           Half get b, half get c. The current homepage (a) is only shown when
           the competition is switched off.

         HOW IT WORKS
           Runs here, in the <head>, before the page paints: it picks a version,
           writes it to <html data-ab="a|b|c">, and CSS in src/styles/site.css
           shows that hero panel and hides the others. All three panels are in
           the prerendered HTML, so there is no flicker and one URL for Google.

         ON / OFF
           Always on for staging and localhost, so the flow can be reviewed.
           On www.homeassist.co.za it only runs when REWARDS_LIVE is true.
           Flip REWARDS_LIVE to true on launch day, and back to false when the
           draw closes. Off means everyone sees a, the current homepage.

         FORCING A VERSION (for reviewers)
           ?ab=b   always show the all-prizes picture in this browser
           ?ab=c   always show the solar geyser picture in this browser
           ?ab=a   show the current homepage, as it looks with the competition off
           ?ab=reset  forget the choice and draw again
           The choice is kept in localStorage, so it survives page changes.
           (The storage key changed from ha_ab_home to ha_ab_home2 when the
           test changed, so nobody stays on an old assignment.)

         MEASURING
           Every GA4 event carries ab_variant (b, c, a when forced, or off).
           Register ab_variant as an event-scoped custom dimension in GA4
           Admin, then compare rewards_click, whatsapp_click and phone_click
           for b against c, for sessions that landed on /. -->
    <script>
      (function () {
        var REWARDS_LIVE = false;
        var KEY = 'ha_ab_home2';
        var host = location.hostname;
        var on = REWARDS_LIVE || host.indexOf('staging.') === 0 || host === 'localhost' || host === '127.0.0.1';
        var v = 'off';
        function draw() { return Math.random() < 0.5 ? 'b' : 'c'; }
        if (on) {
          try {
            var q = new URLSearchParams(location.search).get('ab');
            if (q === 'reset') { localStorage.removeItem(KEY); q = null; }
            var ok = { a: 1, b: 1, c: 1 };
            if (ok[q]) { v = q; localStorage.setItem(KEY, v); }
            else {
              var saved = localStorage.getItem(KEY);
              if (ok[saved]) v = saved;
              else { v = draw(); localStorage.setItem(KEY, v); }
            }
          } catch (e) { v = draw(); }
        }
        document.documentElement.setAttribute('data-ab', v);
        window.HA_AB = v;
        gtag('set', { ab_variant: v });
        gtag('set', 'user_properties', { home_hero_variant: v });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
  </body>
</html>
