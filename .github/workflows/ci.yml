name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs the codemods, the Vite build and the prerender.
      - run: npm run build

      # Fails on broken references, missing metadata, empty pages or lorem ipsum.
      - run: npm run verify

      # Handy for reviewing a change without building locally.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
